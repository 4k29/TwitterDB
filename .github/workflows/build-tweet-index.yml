name: Build compact tweet index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tweets.js
      - scripts/build-tweet-index.mjs

permissions:
  contents: write

concurrency:
  group: build-tweet-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build compact data
        run: node scripts/build-tweet-index.mjs
      - name: Commit generated index
        run: |
          if git diff --quiet -- tweets-index.js; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tweets-index.js
          git commit -m "Build compact tweet index"
          git push

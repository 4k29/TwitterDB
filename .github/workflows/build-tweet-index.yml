name: Sync derived tweet data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tweets.js
      - scripts/sync-analytics.mjs

permissions:
  contents: write

concurrency:
  group: build-tweet-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync analytics data
        run: node scripts/sync-analytics.mjs
      - name: Commit generated data
        run: |
          if git diff --quiet -- analytics/data.js analytics/categories.js; then
            echo "No analytics changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/data.js analytics/categories.js
          git commit -m "Sync derived tweet data"
          git push

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>TwitterDB</title>
  <meta name="description" content="過去ツイートを検索・絞り込みできる個人用データベース">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">TwitterDB</p>
        <h1>過去ツイートを、探す。</h1>
      </div>
      <div class="header-actions">
        <button id="syncSettings" class="secondary" type="button">同期設定</button>
        <button id="showDeleted" class="secondary" type="button">削除済み <span id="deletedCount">0</span></button>
      </div>
    </header>

    <section class="filters" aria-label="検索条件">
      <label class="search-field">
        <span>検索</span>
        <input id="query" type="search" placeholder="投稿本文を検索" autocomplete="off">
      </label>
      <label><span>開始日</span><input id="fromDate" type="date"></label>
      <label><span>終了日</span><input id="toDate" type="date"></label>
      <label><span>投稿種別</span>
        <select id="typeFilter">
          <option value="all">すべて</option>
          <option value="post">通常投稿</option>
          <option value="reply">返信</option>
          <option value="quote">引用</option>
          <option value="repost">リポスト</option>
        </select>
      </label>
      <label><span>返信先</span><select id="replyFilter"><option value="all">すべて</option></select></label>
      <label><span>並び順</span>
        <select id="sortOrder">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
          <option value="likes">いいね順</option>
          <option value="reposts">リポスト順</option>
        </select>
      </label>
      <button id="resetFilters" class="secondary reset" type="button">絞り込みを解除</button>
    </section>

    <section class="summary" aria-live="polite">
      <div><strong id="resultCount">0</strong><span>件</span></div>
      <p id="rangeLabel">データを読み込んでいます…</p>
      <p id="syncState">同期状態を確認しています…</p>
    </section>

    <section id="status" class="status" hidden></section>
    <section id="tweetList" class="tweet-list" aria-label="投稿一覧"></section>
    <button id="loadMore" class="load-more" type="button" hidden>さらに表示</button>
  </main>

  <dialog id="deleteDialog">
    <form method="dialog" class="dialog-card">
      <h2>一覧から削除しますか？</h2>
      <p>X上の投稿は削除されません。TwitterDBの検索結果から除外し、GitHubを通して端末間で同期します。</p>
      <blockquote id="deleteExcerpt"></blockquote>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">キャンセル</button>
        <button id="confirmDelete" value="delete" class="danger">一覧から削除</button>
      </div>
    </form>
  </dialog>

  <dialog id="deletedDialog">
    <div class="dialog-card deleted-card">
      <div class="dialog-head">
        <div><p class="eyebrow">TwitterDB</p><h2>削除済み</h2></div>
        <button id="closeDeleted" class="secondary" type="button">閉じる</button>
      </div>
      <input id="deletedQuery" type="search" placeholder="削除済みの投稿を検索">
      <div id="deletedList" class="deleted-list"></div>
    </div>
  </dialog>

  <dialog id="syncDialog">
    <form id="syncForm" class="dialog-card">
      <div class="dialog-head">
        <div><p class="eyebrow">GitHub Sync</p><h2>同期設定</h2></div>
        <button id="closeSync" class="secondary" type="button">閉じる</button>
      </div>
      <p>TwitterDBだけに書き込めるFine-grained personal access tokenを、この端末に保存します。トークンはGitHubやtweets.jsには書き込みません。</p>
      <label><span>Fine-grained token</span><input id="githubToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>
      <div class="dialog-actions">
        <button id="clearToken" class="secondary" type="button">この端末から削除</button>
        <button id="saveToken" type="submit">保存して接続確認</button>
      </div>
      <p id="syncMessage" class="muted"></p>
    </form>
  </dialog>

  <script>window.YTD = window.YTD || { tweets: {} };</script>
  <script src="./tweets.js"></script>
  <script src="./app.js"></script>
</body>
</html>

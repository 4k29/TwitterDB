<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>TwitterDB</title>
  <meta name="description" content="過去ツイートを絞り込み、リンク先の存在状態を確認できる個人用データベース">
  <link rel="stylesheet" href="./styles.css?v=9">
  <link rel="stylesheet" href="./ui-v3.css?v=9">
  <link rel="stylesheet" href="./ui-v4.css?v=9">
  <link rel="stylesheet" href="./ui-v5.css?v=9">
  <link rel="stylesheet" href="./ui-v6.css?v=9">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">TwitterDB</p>
        <h1>過去ツイートを、探す。</h1>
      </div>
      <div class="header-actions">
        <button id="syncSettings" class="sync-button" type="button" aria-haspopup="dialog" aria-controls="syncDialog">同期設定を開く</button>
        <button id="showDeleted" class="secondary" type="button">削除済み <span id="deletedCount">0</span></button>
        <span id="syncBadge" class="sync-status" data-state="loading">確認中…</span>
        <span id="checkBadge" class="check-status" data-state="idle">リンク未確認</span>
      </div>
    </header>

    <section class="filters" aria-label="絞り込み条件">
      <label><span>投稿種別</span>
        <select id="typeFilter">
          <option value="all">すべて</option>
          <option value="post">通常投稿</option>
          <option value="reply">返信</option>
          <option value="quote">引用</option>
          <option value="repost">リポスト</option>
        </select>
      </label>
      <label><span>返信先・メンション</span><select id="replyFilter"><option value="all">すべて</option></select></label>
      <label><span>並び順</span>
        <select id="sortOrder">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
          <option value="likes">いいね順</option>
          <option value="reposts">リポスト順</option>
        </select>
      </label>
      <button id="checkVisible" class="check-all-button" type="button">表示中を確認</button>
      <button id="resetFilters" class="secondary reset" type="button">絞り込みを解除</button>
    </section>

    <section id="bulkActions" class="bulk-actions" data-active="false" aria-label="複数選択操作">
      <p><strong id="selectedCount">0</strong>件選択中</p>
      <button id="selectVisible" class="secondary" type="button">表示中をすべて選択</button>
      <button id="clearSelected" class="secondary" type="button" disabled>選択解除</button>
      <button id="deleteSelected" class="bulk-delete" type="button" disabled>選択した投稿を削除</button>
    </section>

    <section class="summary" aria-live="polite">
      <div><strong id="resultCount">0</strong><span>件</span></div>
      <p id="rangeLabel">データを読み込んでいます…</p>
      <p id="syncState">同期状態を確認しています…</p>
    </section>

    <section id="status" class="status" hidden></section>
    <section id="tweetList" class="tweet-list" aria-label="投稿一覧"></section>
    <button id="loadMore" class="load-more" type="button" hidden>さらに表示</button>
  </main>

  <dialog id="deletedDialog">
    <div class="dialog-card deleted-card">
      <div class="dialog-head">
        <div><p class="eyebrow">TwitterDB</p><h2>削除済み</h2></div>
        <button id="closeDeleted" class="secondary" type="button">閉じる</button>
      </div>
      <input id="deletedQuery" type="search" placeholder="削除済みの投稿を検索">
      <div id="deletedList" class="deleted-list"></div>
    </div>
  </dialog>

  <dialog id="syncDialog">
    <form id="syncForm" class="dialog-card">
      <div class="dialog-head">
        <div><p class="eyebrow">GitHub Sync</p><h2>同期設定</h2></div>
        <button id="closeSync" class="secondary" type="button">閉じる</button>
      </div>
      <p>TwitterDBだけにアクセスできるFine-grained personal access tokenを、この端末に保存します。削除同期にはContentsのRead and write、リンク確認にはActionsのRead and writeが必要です。</p>
      <label><span>Fine-grained token</span><input id="githubToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>
      <div class="dialog-actions">
        <button id="clearToken" class="secondary" type="button">この端末から削除</button>
        <button id="saveToken" type="submit">保存して接続確認</button>
      </div>
      <p id="syncMessage" class="muted"></p>
    </form>
  </dialog>

  <script>window.YTD = window.YTD || { tweets: {} };</script>
  <script src="./tweets.js"></script>
  <script src="./app-v8.js?v=9"></script>
</body>
</html>
